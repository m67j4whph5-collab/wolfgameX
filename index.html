<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>オンライン人狼ジャッジメント 完全版</title>
<style>
body{margin:0;padding:0;font-family:sans-serif;background:linear-gradient(#0d1b2a,#1b263b);color:white;overflow-x:hidden;padding-bottom:60px;}
.wrapper{max-width:600px;margin:0 auto;padding:10px;background:rgba(0,0,0,0.25);backdrop-filter:blur(5px);border-radius:10px;position:relative;}
#infoBar{font-size:12px;display:flex;justify-content:space-between;margin-bottom:5px;}
#logView{background: rgba(0,0,0,0.7); padding:10px; border-radius:6px; max-height:70vh; min-height:70vh; overflow-y:auto; font-size:14px; line-height:1.4; width:95%; margin:0 auto;}
.bubble{max-width:85%; margin:4px 0; padding:6px 10px; border-radius:15px; clear:both; display:inline-block; word-wrap:break-word;}
.self{background:#4a90e2;color:white;float:right;text-align:right;}
.other{background:#333;color:white;float:left;text-align:left;}
#tabs{margin-top:5px;}
#tabs button{padding:5px 8px;margin:2px;font-size:14px;border:none;border-radius:6px;background:#444;color:white;}
#tabs button.active{background:#666;}
#inputBar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:95%;display:flex;background: rgba(0,0,0,0.7);padding:5px;border-radius:10px 10px 0 0;}
#inputBar input{flex:1;padding:8px;border-radius:6px;border:none;font-size:16px;}
#inputBar button{padding:8px;margin-left:3px;border-radius:6px;border:none;background:#555;color:white;font-size:14px;}
#votes,#nightActions{display:none;margin-top:5px;width:95%;margin:0 auto;}
button.voteBtn,button.nightBtn{margin:2px;padding:8px 10px;border-radius:6px;border:none;background:#444;color:white;}
button.voteBtn:hover,button.nightBtn:hover{background:#666;}
#fogCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;}
@keyframes highlight {0% { box-shadow: 0 0 0px yellow; } 50% { box-shadow: 0 0 15px yellow; } 100% { box-shadow: 0 0 0px yellow; }}
.highlight{animation: highlight 1.2s ease-in-out;}
#statsPopup{display:none;position:fixed;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:15px;border-radius:10px;color:white;z-index:1000;}
#statsPopup table{width:100%;text-align:left;}
#statsPopup button{margin-top:5px;padding:5px;border:none;background:#444;color:white;border-radius:6px;}
#turnTimer{margin-top:3px;font-size:12px;text-align:center;}
</style>
</head>
<body>
<audio id="bgm" src="https://www.chosic.com/wp-content/uploads/2021/10/Halloween-Horror-Creepy-Piano.mp3" loop autoplay></audio>
<canvas id="fogCanvas"></canvas>

<div class="wrapper" id="lobbyScreen">
<h2>オンライン人狼ジャッジメント 完全版</h2>
<input id="roomId" placeholder="ルームID">
<input id="playerName" placeholder="名前">
<button onclick="startGame()">ルーム作成/参加</button>
<button onclick="toggleBGM()">BGM ON/OFF</button>
<button onclick="showStats()">戦績を見る</button>
</div>

<div class="wrapper" id="gameScreen" style="display:none;">
<div id="infoBar">
<span>ルーム: <span id="currentRoom"></span></span>
<span>役職: <span id="role"></span></span>
<span>昼/夜: <span id="turn"></span></span>
</div>
<div id="turnTimer"></div>
<div id="logView"></div>
<div id="tabs"></div>
<div id="votes"></div>
<div id="nightActions"></div>

<div id="inputBar">
<input id="msg" placeholder="盛り上がろう！">
<button onclick="sendMessage()">送信</button>
</div>
</div>

<div id="statsPopup">
<h3>プレイヤー戦績</h3>
<table>
<thead><tr><th>名前</th><th>勝利</th><th>敗北</th><th>プレイ回数</th></tr></thead>
<tbody></tbody>
</table>
<button onclick="closeStats()">閉じる</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase初期化
const firebaseConfig={apiKey:"AIzaSyArrBmwJJdku58WdeAnQ3PeyiL2U2FweJ8",authDomain:"online-wolfgame.firebaseapp.com",databaseURL:"https://online-wolfgame-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"online-wolfgame",storageBucket:"online-wolfgame.storage.app",messagingSenderId:"582158578809",appId:"1:582158578809:web:568851b778ea63813210a8"};
const app=firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// グローバル変数
let roomId='',playerName='',role='',turn='day',turnTime=60,turnExtensionCount=0,maxExtension=7;
const roles=["村人","人狼","占い師","霊能者","狂人","狩人"];
const roleIcons={"村人":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/villager.png","人狼":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/werewolf.png","占い師":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/seer.png","霊能者":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/medium.png","狂人":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/traitor.png","狩人":"https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/icons/hunter.png"};
let players=[],logs={},aliveStatus={},graveStatus={},nightActions={},votes={};
let turnTimerId;

// BGM切替
function toggleBGM(){const bgm=document.getElementById("bgm"); bgm.paused?bgm.play():bgm.pause();}

// ルーム作成/参加
function startGame(){
  roomId=document.getElementById("roomId").value.trim();
  playerName=document.getElementById("playerName").value.trim();
  if(!roomId||!playerName){alert("ルームIDと名前を入力");return;}
  const playerRef=db.ref('rooms/'+roomId+'/players/'+playerName);
  playerRef.get().then(snap=>{
    if(snap.exists()){alert("同じ名前が存在");return;}
    role=roles[Math.floor(Math.random()*roles.length)];
    playerRef.set({role:role,alive:true,stats:{win:0,lose:0,played:0}}).then(()=>{
      document.getElementById("lobbyScreen").style.display="none";
      document.getElementById("gameScreen").style.display="block";
      document.getElementById("currentRoom").textContent=roomId;
      document.getElementById("role").textContent=role;
      setupListeners();
      initAlive();
      startTurn();
    });
  });
}

// 占い結果判定（白黒、狂人は白）
function getDivinationResult(targetRole){
  return (targetRole==="人狼")?"黒":"白";
}
function showDivination(oracleName,targetName,targetRole){
  if(playerName!==oracleName) return;
  const result=getDivinationResult(targetRole);
  addLog("占い結果",targetName,result);
}

// ここに昼・夜ターン自動切替＋過半数延長＋死亡判定＋墓場チャット＋戦績更新を組み込む
</script>
</body>
</html>
