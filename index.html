<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WEREWOLF</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">

<style>
html,body{
margin:0;
background:black;
color:white;
font-family:-apple-system;
overflow:hidden;
}
#app{
max-width:430px;
margin:auto;
height:100vh;
display:flex;
flex-direction:column;
}

/* ===== ホーム ===== */
#home{
flex:1;
background:
radial-gradient(circle at top,#300,#000);
display:flex;
flex-direction:column;
justify-content:center;
padding:20px;
}

.title{
text-align:center;
font-size:34px;
letter-spacing:4px;
color:#f00;
text-shadow:0 0 20px red;
margin-bottom:30px;
animation:pulse 3s infinite;
}

@keyframes pulse{
50%{opacity:.5}
}

input,button{
width:100%;
padding:15px;
border-radius:12px;
border:none;
margin:8px 0;
font-size:16px;
}

input{background:#111;color:#fff;}

button{
background:linear-gradient(45deg,#f00,#400);
color:#fff;
font-weight:bold;
}

/* ===== ゲーム ===== */
#game{
flex:1;
display:none;
flex-direction:column;
background:black;
position:relative;
}

#timer{
text-align:center;
padding:10px;
background:#100;
font-size:18px;
}

/* 夜 */
.night{
background:black;
animation:dark 2s forwards;
}
@keyframes dark{
from{background:#300;}
to{background:black;}
}

/* 血 */
#blood{
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:url("https://i.imgur.com/8P5vC9B.png") center/cover;
opacity:0;
pointer-events:none;
}

/* 投票 */
#players{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.player{
background:#111;
padding:20px;
border-radius:12px;
text-align:center;
font-size:22px;
}

.player.selected{
border:2px solid red;
}

/* 心拍 */
.heartbeat{
animation:beat 1s infinite;
}
@keyframes beat{
50%{transform:scale(1.05);}
}
</style>
</head>

<body>
<div id="app">

<!-- ホーム -->
<div id="home">
<div class="title">WEREWOLF</div>
<input id="name" placeholder="名前">
<input id="room" placeholder="ルームID">
<button onclick="start()">闇へ入る</button>
</div>

<!-- ゲーム -->
<div id="game">
<div id="timer">昼 240</div>
<div id="players"></div>
<div id="blood"></div>
</div>

</div>

<audio id="heart" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
let phase="day";
let time=240;
let selected=null;

const timer=document.getElementById("timer");
const players=document.getElementById("players");
const blood=document.getElementById("blood");
const heart=document.getElementById("heart");

/* PWA */
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

function start(){
document.getElementById("home").style.display="none";
document.getElementById("game").style.display="flex";
createPlayers();
runTimer();
}

/* プレイヤー生成 */
function createPlayers(){
players.innerHTML="";
for(let i=0;i<9;i++){
let p=document.createElement("div");
p.className="player";
p.innerHTML="👤<br>Player"+(i+1);

p.onclick=()=>{
document.querySelectorAll(".player")
.forEach(x=>x.classList.remove("selected"));
p.classList.add("selected");
selected=i;
};

players.appendChild(p);
}
}

/* タイマー */
function runTimer(){
setInterval(()=>{
time--;
timer.innerText=(phase==="day"?"昼 ":"投票 ")+time;

if(time<=0){
nextPhase();
}
},1000);
}

/* フェーズ */
function nextPhase(){

if(phase==="day"){
phase="vote";
time=60;
}
else if(phase==="vote"){
attack();
phase="night";
time=40;
}
else{
phase="day";
time=240;
}
}

/* 襲撃 */
function attack(){
blood.style.opacity=1;
heart.play();
navigator.vibrate([200,100,200]);

setTimeout(()=>{
blood.style.opacity=0;
},2000);
}
</script>
</body>
</html>
