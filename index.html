<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オンライン人狼ジャッジメント風</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/IMG_1346.png">
  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 15px; }
    h2, h3 { font-size: 18px; margin: 10px 0; }
    input, button {
      font-size: 16px;
      padding: 12px;
      margin: 5px 0;
      width: 90%;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #555;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #777; }
    #chat {
      border: 1px solid #444;
      background: #222;
      height: 150px;
      overflow-y: auto;
      margin: 10px 0;
      padding: 8px;
      border-radius: 8px;
      text-align: left;
    }
    #players { margin: 10px 0; padding: 5px; text-align: left; }
    .room-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .room-buttons button { flex: 1; min-width: 100px; }
    /* 画面切替 */
    #gameScreen { display: none; }
  </style>
</head>
<body>
  <div class="wrapper" id="lobbyScreen">
    <h1>オンライン人狼ジャッジメント風</h1>
    <input id="roomId" placeholder="ルームID">
    <input id="playerName" placeholder="プレイヤー名">
    <div class="room-buttons">
      <button onclick="startGame()">ルーム作成</button>
      <button onclick="startGame()">ルーム参加</button>
    </div>
  </div>

  <div class="wrapper" id="gameScreen">
    <h1>ルーム: <span id="currentRoom"></span></h1>
    <h2 id="role">役職: 未決定</h2>
    <h3>プレイヤー一覧</h3>
    <div id="players"></div>
    <h3>チャット</h3>
    <div id="chat"></div>
    <input id="msg" placeholder="メッセージ">
    <button onclick="send()">送信</button>
  </div>

  <script>
    const players = [];

    function startGame() {
      const room = document.getElementById("roomId").value.trim();
      const player = document.getElementById("playerName").value.trim();
      if(!room || !player) {
        alert("ルームIDとプレイヤー名を入力してください");
        return;
      }

      // 画面切替
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";

      // ルーム表示
      document.getElementById("currentRoom").textContent = room;

      // プレイヤー追加
      players.push(player);
      updatePlayers();

      // 役職ランダム決定
      const roles = ["村人","人狼","占い師","霊能者","狂人"];
      const role = roles[Math.floor(Math.random() * roles.length)];
      document.getElementById("role").textContent = `役職: ${role}`;
    }

    function updatePlayers() {
      const playersDiv = document.getElementById("players");
      playersDiv.innerHTML = players.map(p => `<p>${p}</p>`).join("");
    }

    function send() {
      const msgInput = document.getElementById("msg");
      const chat = document.getElementById("chat");
      const msg = msgInput.value.trim();
      if(!msg) return;
      chat.innerHTML += `<p><b>${players[0]}:</b> ${msg}</p>`; // 現状1人分
      chat.scrollTop = chat.scrollHeight;
      msgInput.value = "";
    }
  </script>
</body>
</html>
