<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Werewolf Online</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b0b0b;
  color:white;
}

header{
  text-align:center;
  padding:10px;
  font-size:22px;
  background:#111;
}

#chat{
  height:55vh;
  overflow-y:auto;
  padding:10px;
}

.msg{
  margin:6px 0;
}

#bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:8px;
  display:flex;
}

input{
  flex:1;
  font-size:16px;
}

button{
  font-size:16px;
}
</style>
</head>

<body>

<header>🐺 Werewolf Online</header>

<div id="info"></div>
<div id="chat"></div>

<div id="bottom">
<input id="text" placeholder="メッセージ">
<button onclick="send()">送信</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAoq3s75YB0zNAGJvPxR25L-iZFWjjDIAI",
  authDomain: "werewolf-online-38465.firebaseapp.com",
  databaseURL: "https://werewolf-online-38465-default-rtdb.firebaseio.com",
  projectId: "werewolf-online-38465",
  storageBucket: "werewolf-online-38465.appspot.com",
  messagingSenderId: "388144035410",
  appId: "1:388144035410:web:d8d4b573c1ffa5e7d9d18b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ルームID
const roomId =
new URLSearchParams(location.search).get("room")
|| Math.random().toString(36).slice(2,7);

document.getElementById("info").innerHTML =
"ルームID: "+roomId;

// 名前
let name = localStorage.getItem("name");
if(!name){
  name = prompt("名前を入力");
  localStorage.setItem("name", name);
}

// 参加登録
const playerRef =
ref(db, "rooms/"+roomId+"/players/"+name);

set(playerRef, {
  name,
  join: Date.now()
});

// チャット送信
window.send = ()=>{
  const t = document.getElementById("text");
  if(!t.value) return;

  push(
    ref(db, "rooms/"+roomId+"/chat"),
    {
      name,
      text:t.value,
      time:Date.now()
    }
  );

  t.value="";
};

// チャット受信
onChildAdded(
ref(db, "rooms/"+roomId+"/chat"),
snap=>{
  const d = snap.val();
  const div = document.createElement("div");
  div.className="msg";
  div.innerHTML =
  "<b>"+d.name+"</b>: "+d.text;
  document.getElementById("chat")
  .appendChild(div);
});
</script>

</body>
</html>
