<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEREWOLF</title>

<style>
/* ===== 基本 ===== */
body{
margin:0;
background:black;
font-family:-apple-system;
color:white;
display:flex;
justify-content:center;
}

/* ===== スマホ枠 ===== */
#app{
max-width:420px;
width:100%;
min-height:100vh;
background:
radial-gradient(circle at top,#300,#000),
url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
background-size:cover;
background-blend-mode:overlay;
}

/* ===== タイトル ===== */
.title{
text-align:center;
padding:50px 10px;
font-size:32px;
letter-spacing:4px;
color:#ff0000;
text-shadow:
0 0 10px red,
0 0 30px red,
0 0 50px red;
animation:pulse 3s infinite;
}

@keyframes pulse{
0%{opacity:0.7}
50%{opacity:1}
100%{opacity:0.7}
}

/* ===== カード ===== */
.card{
margin:15px;
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:18px;
backdrop-filter:blur(10px);
box-shadow:0 0 40px rgba(255,0,0,0.2);
}

/* ===== 入力 ===== */
input{
width:100%;
padding:14px;
margin:8px 0;
background:#050505;
border:none;
border-radius:12px;
color:white;
font-size:16px;
}

/* ===== ボタン ===== */
button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
margin-top:10px;
font-size:16px;
font-weight:bold;
background:linear-gradient(45deg,#ff0000,#400000);
color:white;
box-shadow:0 0 20px rgba(255,0,0,0.5);
}

/* ===== アイコン ===== */
.iconGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.icon{
aspect-ratio:1;
background:#000;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
border:2px solid transparent;
transition:0.2s;
}

.icon.active{
border:2px solid red;
box-shadow:0 0 20px red;
transform:scale(1.1);
}

</style>
</head>

<body>
<div id="app">

<div class="title">WEREWOLF</div>

<div class="card">
<input id="name" placeholder="名前">
</div>

<div class="card">
<div>魂の姿を選べ</div>
<div class="iconGrid" id="icons"></div>
</div>

<div class="card">
<input id="room" placeholder="ルームID">
<button onclick="join()">闇へ入る</button>
</div>

</div>

<script>

const icons=["🐺","😈","💀","👁","🩸","🧛","🦇","🕷","🔥","🌙","⚰","🕯"];
let selected=0;

const grid=document.getElementById("icons");

icons.forEach((i,idx)=>{
const d=document.createElement("div");
d.className="icon";
d.textContent=i;
if(idx===0)d.classList.add("active");

d.onclick=()=>{
document.querySelectorAll(".icon").forEach(e=>e.classList.remove("active"));
d.classList.add("active");
selected=idx;
};

grid.appendChild(d);
});

function join(){
const name=document.getElementById("name").value;
const room=document.getElementById("room").value;

if(!name || !room){
alert("入力してください");
return;
}

localStorage.name=name;
localStorage.icon=icons[selected];
localStorage.room=room;

alert("次はゲームへ…");
}

</script>
</body>
</html
