<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAoq3s75YB0zNAGJvPxR25L-iZFWjjDIAI",
authDomain: "werewolf-online-38465.firebaseapp.com",
databaseURL:"https://werewolf-online-38465-default-rtdb.firebaseio.com/",
projectId: "werewolf-online-38465"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let playerId = localStorage.playerId || Math.random().toString(36).slice(2);
localStorage.playerId = playerId;

let roomId;
let role;
let alive=true;

// 画面切り替え
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// 参加
window.joinRoom=()=>{
roomId=document.getElementById("room").value;
const name=document.getElementById("name").value;

set(ref(db,`rooms/${roomId}/players/${playerId}`),{
name,alive:true
});

listenRoom();
show("roomScreen");
};

// プレイヤー同期
function listenRoom(){
onValue(ref(db,`rooms/${roomId}/players`),(snap)=>{
const data=snap.val()||{};
const div=document.getElementById("players");
div.innerHTML="";
Object.entries(data).forEach(([id,p])=>{
div.innerHTML+=`<div class="player">${p.name}</div>`;
});
});
}

// ゲーム開始
window.startGame=()=>{
assignRoles();
set(ref(db,`rooms/${roomId}/day`),1);
set(ref(db,`rooms/${roomId}/phase`),"day");
show("game");
listenGame();
};

// 役職配布
function assignRoles(){
onValue(ref(db,`rooms/${roomId}/players`),(snap)=>{
const players=snap.val();
let ids=Object.keys(players);

let wolves=Math.max(1,Math.floor(ids.length/4));

ids.sort(()=>Math.random()-0.5);

ids.forEach((id,i)=>{
let r="villager";
if(i<wolves) r="wolf";
if(i===wolves) r="seer";

update(ref(db,`rooms/${roomId}/players/${id}`),{role:r});
if(id===playerId) role=r;
});
},{onlyOnce:true});
}

// ゲーム同期
function listenGame(){

// phase
onValue(ref(db,`rooms/${roomId}/phase`),(snap)=>{
document.getElementById("phase").textContent=snap.val();
});

// 投票
onValue(ref(db,`rooms/${roomId}/votes`),(snap)=>{
checkVote();
});

// 夜
onValue(ref(db,`rooms/${roomId}/nightKill`),(snap)=>{
if(snap.exists()) nextDay();
});

}

// 投票
function checkVote(){
onValue(ref(db,`rooms/${roomId}/votes`),(snap)=>{
const votes=snap.val()||{};
let count={};

Object.values(votes).forEach(v=>{
count[v]=(count[v]||0)+1;
});

let max=0,target=null;
for(let k in count){
if(count[k]>max){
max=count[k];
target=k;
}
}

if(target){
update(ref(db,`rooms/${roomId}/players/${target}`),{alive:false});
set(ref(db,`rooms/${roomId}/phase`),"night");
}
});
}

// 夜キル
window.kill=(id)=>{
if(role!=="wolf") return;
set(ref(db,`rooms/${roomId}/nightKill`),id);
update(ref(db,`rooms/${roomId}/players/${id}`),{alive:false});
};

// 次の日
function nextDay(){
set(ref(db,`rooms/${roomId}/votes`),null);
set(ref(db,`rooms/${roomId}/nightKill`),null);

onValue(ref(db,`rooms/${roomId}/day`),(snap)=>{
let d=snap.val()+1;
set(ref(db,`rooms/${roomId}/day`),d);
set(ref(db,`rooms/${roomId}/phase`),"day");
checkWin();
},{onlyOnce:true});
}

// 勝敗
function checkWin(){
onValue(ref(db,`rooms/${roomId}/players`),(snap)=>{
const players=snap.val();

let wolf=0,vill=0;

Object.values(players).forEach(p=>{
if(!p.alive) return;
if(p.role==="wolf") wolf++;
else vill++;
});

if(wolf>=vill){
alert("人狼勝利");
}
if(wolf===0){
alert("村勝利");
}
},{onlyOnce:true});
}

</script>
