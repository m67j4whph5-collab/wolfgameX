<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オンライン人狼フル版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:sans-serif;background:#111;color:white;text-align:center;margin:0;padding:0;}
.wrapper{max-width:600px;margin:0 auto;padding:10px;}
input,button{padding:10px;margin:5px;font-size:16px;}
#chat,#players,#votes,#nightActions,#gameLog{background:#222;padding:5px;margin:5px;max-height:150px;overflow:auto;}
h1,h2,h3{margin:5px;}
button{cursor:pointer;}
</style>

<!-- PWAアイコン -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="180x180"
      href="https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/IMG_1346.png">
<link rel="apple-touch-icon" sizes="180x180"
      href="https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/IMG_1346.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="wrapper" id="lobbyScreen">
  <h1>オンライン人狼フル版</h1>
  <input id="roomId" placeholder="ルームID">
  <input id="playerName" placeholder="プレイヤー名">
  <button onclick="startGame()">ルーム作成/参加</button>
</div>

<div class="wrapper" id="gameScreen" style="display:none;">
  <h1>ルーム: <span id="currentRoom"></span></h1>
  <h2 id="role">役職: 未決定</h2>
  <h2 id="turn">昼/夜: 未開始</h2>

  <h3>プレイヤー一覧</h3>
  <div id="players"></div>

  <h3>チャット</h3>
  <div id="chat"></div>
  <input id="msg" placeholder="みんなで盛り上げよう！">
  <button onclick="sendMessage()">送信</button>

  <h3>投票</h3>
  <div id="votes"></div>

  <h3>夜行動</h3>
  <div id="nightActions"></div>

  <h3>ゲームログ</h3>
  <div id="gameLog"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyArrBmwJJdku58WdeAnQ3PeyiL2U2FweJ8",
  authDomain: "online-wolfgame.firebaseapp.com",
  databaseURL: "https://online-wolfgame-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "online-wolfgame",
  storageBucket: "online-wolfgame.storage.app",
  messagingSenderId: "582158578809",
  appId: "1:582158578809:web:568851b778ea63813210a8"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId='', playerName='', role='';
const roles=["村人","人狼","占い師","霊能者","狂人","狩人"];
let players=[], turn="昼";

function startGame(){
  roomId=document.getElementById("roomId").value.trim();
  playerName=document.getElementById("playerName").value.trim();
  if(!roomId||!playerName){alert("ルームIDとプレイヤー名を入力してください");return;}
  document.getElementById("lobbyScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";
  document.getElementById("currentRoom").textContent=roomId;

  role=roles[Math.floor(Math.random()*roles.length)];
  document.getElementById("role").textContent=`役職: ${role}`;

  db.ref('rooms/'+roomId+'/players/'+playerName).set({role:role,alive:true,vote:null});

  db.ref('rooms/'+roomId+'/players').on('value',snap=>{
    const data=snap.val()||{};
    players=Object.keys(data);
    document.getElementById('players').innerHTML=players.map(p=>`<p>${p} (${data[p].role}) ${data[p].alive?"":"(死亡)"}</p>`).join('');
    checkVictory(data);
  });

  db.ref('rooms/'+roomId+'/chat').on('child_added',snap=>{
    const msg=snap.val();
    const chatDiv=document.getElementById('chat');
    chatDiv.innerHTML+=`<p><b>${msg.player}:</b> ${msg.msg}</p>`;
    chatDiv.scrollTop=chatDiv.scrollHeight;
  });

  db.ref('rooms/'+roomId+'/votes').on('value',snap=>{
    const data=snap.val()||{};
    const voteDiv=document.getElementById('votes');
    voteDiv.innerHTML=Object.keys(data).map(p=>`<p>${p} → ${data[p]}</p>`).join('');
    if(turn==="昼") processVotes(data);
  });

  db.ref('rooms/'+roomId+'/nightActions').on('value',snap=>{
    if(turn==="夜") processNight(snap.val()||{});
  });

  db.ref('rooms/'+roomId+'/turn').set(turn);
  db.ref('rooms/'+roomId+'/turn').on('value',snap=>{
    document.getElementById('turn').textContent='昼/夜: '+snap.val();
  });

  showNightActions();
  gameLoop();
}

function sendMessage(){
  const msgInput=document.getElementById("msg");
  const msg=msgInput.value.trim();
  if(!msg) return;
  db.ref('rooms/'+roomId+'/chat').push({player:playerName,msg:msg});
  msgInput.value="";
}

function showNightActions(){
  const nightDiv=document.getElementById('nightActions');
  nightDiv.innerHTML='';
  if(role==="人狼"){ addNightBtn("人狼"); }
  else if(role==="占い師"){ addNightBtn("占い師"); }
  else if(role==="狩人"){ addNightBtn("狩人"); }
}

function addNightBtn(roleType){
  const btn=document.createElement('button');
  btn.textContent=roleType+"行動";
  btn.onclick=()=>selectNightTarget(roleType);
  document.getElementById('nightActions').appendChild(btn);
}

function selectNightTarget(roleType){
  const target=prompt("誰に行動しますか？（名前）");
  if(!target) return;
  db.ref('rooms/'+roomId+'/nightActions/'+playerName).set({role:roleType,target:target});
  alert(roleType+"の行動を"+target+"に登録しました！");
}

function processNight(actions){
  const logs=[];
  db.ref('rooms/'+roomId+'/players').once('value').then(snap=>{
    const data=snap.val()||{};
    let protect=null;
    for(const [p,act] of Object.entries(actions)){if(act.role==="狩人") protect=act.target;}
    for(const [p,act] of Object.entries(actions)){
      if(act.role==="人狼"&&act.target!==protect){if(data[act.target]&&data[act.target].alive){data[act.target].alive=false; logs.push(act.target+" が人狼に襲撃されました💀");}}
      if(act.role==="占い師"&&data[act.target]){logs.push("占い師 "+p+" は "+act.target+" が "+data[act.target].role+" だと占いました🔮");}
    }
    for(const [p,d] of Object.entries(data)){db.ref('rooms/'+roomId+'/players/'+p).update(d);}
    db.ref('rooms/'+roomId+'/nightActions').remove();
    db.ref('rooms/'+roomId+'/gameLog').set(logs.join("<br>"));
    turn="昼"; db.ref('rooms/'+roomId+'/turn').set(turn);
  });
}

function processVotes(votes){
  const count={};
  for(const p in votes){const t=votes[p];if(!count[t]) count[t]=0;count[t]++;}
  let max=null,maxC=0;
  for(const [t,c] of Object.entries(count)){if(c>maxC){max=t;maxC=c;}}
  if(max){db.ref('rooms/'+roomId+'/players/'+max+'/alive').set(false); db.ref('rooms/'+roomId+'/gameLog').push(max+" が投票で吊られました💀");}
  db.ref('rooms/'+roomId+'/votes').remove(); turn="夜"; db.ref('rooms/'+roomId+'/turn').set(turn);
}

function checkVictory(data){
  const alive=Object.values(data).filter(p=>p.alive);
  const wolves=alive.filter(p=>p.role==="人狼").length;
  const villagers=alive.length-wolves;
  if(wolves===0){alert("村人チームの勝利！🎉"); db.ref('rooms/'+roomId).remove();}
  else if(villagers<=wolves){alert("人狼チームの勝利！🐺"); db.ref('rooms/'+roomId).remove();}
}

function gameLoop(){
  setTimeout(()=>{
    db.ref('rooms/'+roomId+'/turn').once('value').then(snap=>{turn=snap.val(); showNightActions();});
    gameLoop();
  },3000);
}
</script>
</body>
</html>
