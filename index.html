<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オンライン人狼</title>

  <!-- スマホ対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ホーム画面アイコン -->
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://raw.githubusercontent.com/m67j4whph5-collab/wolfgameX/main/IMG_1346.png">

  <!-- CSS -->
  <style>
    /* 全体 */
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 0;
    }

    /* ゲーム画面ラッパー */
    .game-wrapper {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    h2, h3 {
      font-size: 18px;
      margin: 10px 0;
    }

    input, button {
      font-size: 16px;
      padding: 12px;
      margin: 5px 0;
      width: 90%; /* 画面幅に合わせる */
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
    }

    button {
      background-color: #555;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #777;
    }

    #chat {
      border: 1px solid #444;
      background: #222;
      height: 150px;
      overflow-y: auto;
      margin: 10px 0;
      padding: 8px;
      border-radius: 8px;
      text-align: left;
    }

    #players {
      margin: 10px 0;
      padding: 5px;
      text-align: left;
    }

    /* モバイルでボタン横並びにする場合 */
    @media (min-width: 400px) {
      .room-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .room-buttons button {
        width: auto;
        flex: 1;
      }
    }
  </style>

  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="game-wrapper">
    <h1>オンライン人狼</h1>

    <!-- ルーム作成・参加 -->
    <input id="roomId" placeholder="ルームID">
    <div class="room-buttons">
      <button onclick="createRoom()">作成</button>
      <button onclick="joinRoom()">参加</button>
    </div>

    <!-- 役職表示 -->
    <h2 id="role"></h2>

    <!-- プレイヤー表示 -->
    <h3>プレイヤー</h3>
    <div id="players"></div>

    <!-- チャット -->
    <h3>チャット</h3>
    <div id="chat"></div>
    <input id="msg" placeholder="メッセージ">
    <button onclick="send()">送信</button>
  </div>

  <script type="module">
    // ここにJSを全部コピペ
    // 例: createRoom(), joinRoom(), send()など
  </script>

</body>
</html>
